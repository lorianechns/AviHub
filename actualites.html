<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Actualités — AviHub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root{--bg:#f8fafc;--bg2:#fff;--bg3:#f1f5f9;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;}
    body{background:#f8fafc;}
    nav{background:#fff;border-bottom:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.06);}
    .nav-logo{color:#f59e0b !important;}
    .nav-links a{color:#64748b;}
    .nav-links a:hover,.nav-links a.active{color:#0f172a;background:#f1f5f9;}
    .card{background:#fff;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;}
    .card:hover{border-color:#f59e0b;box-shadow:0 6px 20px rgba(0,0,0,.1);transform:translateY(-2px);}
    .card-source{color:#f59e0b;}
    .filtre-btn{background:#fff;border:1px solid #e2e8f0;color:#64748b;padding:.35rem .85rem;border-radius:999px;font-size:.8rem;cursor:pointer;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.06);}
    .filtre-btn:hover{border-color:#3b82f6;color:#0f172a;}
    .filtre-btn.active{background:#f59e0b;color:#000;border-color:#f59e0b;font-weight:600;}
    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .2s;}
    .modal-overlay.open{opacity:1;pointer-events:all;}
    .modal-box{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;padding:2rem;position:relative;transform:translateY(20px);transition:transform .2s;box-shadow:0 24px 64px rgba(0,0,0,.2);}
    .modal-overlay.open .modal-box{transform:translateY(0);}
    .modal-close{position:absolute;top:1rem;right:1rem;background:#f1f5f9;border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;color:#64748b;transition:all .15s;}
    .modal-close:hover{background:#e2e8f0;color:#0f172a;}
    .modal-source{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#f59e0b;font-weight:700;margin-bottom:.5rem;}
    .modal-title{font-size:1.2rem;font-weight:700;color:#0f172a;margin-bottom:.75rem;line-height:1.3;}
    .modal-date{font-size:.78rem;color:#64748b;margin-bottom:1rem;}
    .modal-summary{font-size:.9rem;color:#334155;line-height:1.7;margin-bottom:1.25rem;padding:1rem;background:#f8fafc;border-radius:8px;border-left:3px solid #f59e0b;}
    .modal-summary-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin-bottom:.5rem;font-weight:600;}
    .modal-cta{display:inline-block;background:#f59e0b;color:#000;font-weight:700;padding:.6rem 1.25rem;border-radius:8px;text-decoration:none;font-size:.88rem;transition:background .15s;}
    .modal-cta:hover{background:#d97706;}
    .card-img{width:100%;border-radius:8px;margin-bottom:.75rem;max-height:160px;object-fit:cover;}
    .status-bar{font-size:.78rem;color:#64748b;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;}
    .dot{width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block;}
    .dot.warn{background:#f59e0b;}
    .dot.err{background:#ef4444;}
    .source-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:1.25rem;display:flex;align-items:center;gap:1rem;text-decoration:none;color:#0f172a;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:all .15s;}
    .source-card:hover{border-color:#3b82f6;box-shadow:0 6px 16px rgba(0,0,0,.1);}
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">✈ AviHub</a>
  <ul class="nav-links">
    <li><a href="index.html">Accueil</a></li>
    <li><a href="actualites.html" class="active">Actualités</a></li>
    <li><a href="histoire.html">Histoire</a></li>
    <li><a href="bia/index.html">Connaissances</a></li>
    <li><a href="checklist/index.html">Checklist</a></li>
    <li><a href="aeroports/index.html">Aéroports</a></li>
    <li><a href="notes/index.html">Notes</a></li>
    <li><a href="psy2/index.html">PSY2</a></li>
  </ul>
</nav>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">✕</button>
    <div class="modal-source" id="m-source"></div>
    <div class="modal-title" id="m-title"></div>
    <div class="modal-date" id="m-date"></div>
    <div class="modal-summary">
      <div class="modal-summary-label">Résumé</div>
      <div id="m-summary"></div>
    </div>
    <a class="modal-cta" id="m-link" href="#" target="_blank" rel="noopener">Lire l'article complet →</a>
  </div>
</div>

<div class="container">
  <div class="page-title" style="color:#0f172a">📰 Actualités aéronautiques</div>
  <div class="page-subtitle" style="color:#64748b">Flux RSS agrégés — cliquer sur un article pour le résumé</div>

  <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;" id="filtres">
    <button class="filtre-btn active" data-s="all">Toutes</button>
    <button class="filtre-btn" data-s="aerobuzz">🇫🇷 Aerobuzz</button>
    <button class="filtre-btn" data-s="avweb">🇺🇸 AvWeb</button>
    <button class="filtre-btn" data-s="aerocontact">🇫🇷 Aérocontact</button>
    <button class="filtre-btn" data-s="avherald">✈ AvHerald</button>
  </div>
  <div class="status-bar" id="status-bar"></div>
  <div id="news-grid" class="grid grid-2"><div class="loading" style="grid-column:1/-1"><div class="spinner"></div>Chargement…</div></div>
</div>

<script>
const SOURCES = [
  {id:'aerobuzz',  label:'🇫🇷 Aerobuzz.fr',   url:'https://www.aerobuzz.fr/feed/',                          site:'https://www.aerobuzz.fr'},
  {id:'avweb',     label:'🇺🇸 AvWeb',          url:'https://www.avweb.com/feed/',                            site:'https://www.avweb.com'},
  {id:'aerocontact',label:'🇫🇷 Aérocontact',  url:'https://www.aerocontact.com/flux-rss/actualites-aero.xml',site:'https://www.aerocontact.com'},
  {id:'avherald',  label:'✈ Aviation Herald', url:'https://avherald.com/feed/rss.xml',                      site:'https://avherald.com'},
];

let all = [], activeFilter = 'all';

function strip(h){ return (h||'').replace(/<[^>]+>/g,' ').replace(/&[a-z#0-9]+;/gi,' ').replace(/\s+/g,' ').trim(); }
function fmtDate(s){ try{return new Date(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});}catch{return s;} }

function summarize(text){
  const clean = strip(text);
  const sentences = clean.match(/[^.!?]+[.!?]+/g) || [];
  return sentences.slice(0,4).join(' ').slice(0,500) || clean.slice(0,400);
}

function parseXML(xml, src){
  const doc = new DOMParser().parseFromString(xml,'application/xml');
  const items = [...doc.querySelectorAll('item')];
  return items.slice(0,10).map(it => ({
    title: it.querySelector('title')?.textContent || '',
    link: it.querySelector('link')?.textContent || it.querySelector('guid')?.textContent || '',
    description: it.querySelector('description')?.textContent || '',
    pubDate: it.querySelector('pubDate')?.textContent || '',
    thumbnail: it.querySelector('enclosure')?.getAttribute('url') || '',
    _sourceId: src.id, _sourceLabel: src.label, _site: src.site
  }));
}

async function fetchSource(src){
  const proxies = [
    `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(src.url)}&count=10`,
    `https://corsproxy.io/?${encodeURIComponent(src.url)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(src.url)}`,
  ];
  // Try rss2json
  try {
    const r = await fetch(proxies[0], {signal: AbortSignal.timeout(7000)});
    const d = await r.json();
    if(d.status==='ok' && d.items?.length){
      return d.items.map(i=>({
        title:i.title, link:i.link,
        description: strip(i.description||i.content||''),
        pubDate:i.pubDate, thumbnail:i.thumbnail||'',
        _sourceId:src.id, _sourceLabel:src.label, _site:src.site
      }));
    }
  } catch {}
  // Try corsproxy
  try {
    const r = await fetch(proxies[1], {signal: AbortSignal.timeout(7000)});
    const text = await r.text();
    const parsed = parseXML(text, src);
    if(parsed.length) return parsed;
  } catch {}
  // Try allorigins
  try {
    const r = await fetch(proxies[2], {signal: AbortSignal.timeout(7000)});
    const text = await r.text();
    const parsed = parseXML(text, src);
    if(parsed.length) return parsed;
  } catch {}
  return null; // failed
}

function openModal(item){
  document.getElementById('m-source').textContent = item._sourceLabel;
  document.getElementById('m-title').textContent  = item.title;
  document.getElementById('m-date').textContent   = '📅 ' + fmtDate(item.pubDate);
  document.getElementById('m-summary').textContent = summarize(item.description) || '(Aucun résumé disponible dans le flux RSS)';
  document.getElementById('m-link').href = item.link;
  document.getElementById('modal').classList.add('open');
}
function closeModal(e){ if(e.target === document.getElementById('modal')) document.getElementById('modal').classList.remove('open'); }

function renderCard(item){
  const desc = (item.description||'').slice(0,150);
  return `<div class="card" onclick='openModal(${JSON.stringify(item).replace(/'/g,"&#39;")})'>
    ${item.thumbnail?`<img class="card-img" src="${item.thumbnail}" alt="" onerror="this.style.display='none'">` : ''}
    <div class="card-source">${item._sourceLabel}</div>
    <div class="card-title">${item.title}</div>
    <div class="card-desc">${desc}…</div>
    <div class="card-date" style="display:flex;justify-content:space-between;margin-top:.75rem">
      <span>${fmtDate(item.pubDate)}</span>
      <span style="color:#3b82f6;font-size:.75rem">Résumé →</span>
    </div>
  </div>`;
}

function renderFallback(failed){
  const grid = document.getElementById('news-grid');
  const existing = all.length ? `<div class="grid grid-2" style="margin-top:1.5rem">${all.map(renderCard).join('')}</div>` : '';
  const failHtml = failed.map(s=>`
    <a class="source-card" href="${s.site}" target="_blank" rel="noopener">
      <span style="font-size:1.5rem">🔗</span>
      <div><div style="font-weight:700;font-size:.9rem">${s.label}</div><div style="font-size:.75rem;color:#64748b">${s.site}</div></div>
    </a>`).join('');
  if(failed.length && !all.length){
    grid.innerHTML = `<div style="grid-column:1/-1"><div style="font-size:.85rem;color:#64748b;margin-bottom:1rem">⚠️ Chargement RSS limité (CORS). Accès direct :</div><div class="grid grid-2">${failHtml}</div></div>`;
  }
}

function renderArticles(){
  const grid = document.getElementById('news-grid');
  const filtered = activeFilter==='all' ? all : all.filter(a=>a._sourceId===activeFilter);
  if(!filtered.length){ grid.innerHTML=`<div class="loading" style="grid-column:1/-1;color:#64748b">Aucun article pour cette source.</div>`; return; }
  grid.innerHTML = filtered.map(renderCard).join('');
}

async function loadAll(){
  const bar = document.getElementById('status-bar');
  const results = await Promise.allSettled(SOURCES.map(fetchSource));
  const failed = [];
  results.forEach((r,i)=>{
    if(r.status==='fulfilled' && r.value?.length) all.push(...r.value);
    else failed.push(SOURCES[i]);
  });
  all.sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate));
  const ok = SOURCES.length - failed.length;
  bar.innerHTML = ok
    ? `<span class="dot"></span>${all.length} articles — ${ok} source${ok>1?'s':''} chargée${ok>1?'s':''}`
    + (failed.length?` · <span style="color:#f59e0b">${failed.map(f=>f.label).join(', ')} indisponible${failed.length>1?'s':''}</span>`:'')
    : `<span class="dot err"></span>Chargement limité`;
  if(all.length) renderArticles(); else renderFallback(failed);
}

document.getElementById('filtres').addEventListener('click',e=>{
  const b=e.target.closest('.filtre-btn'); if(!b) return;
  document.querySelectorAll('.filtre-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); activeFilter=b.dataset.s; renderArticles();
});
loadAll();
</script>
</body>
</html>
