<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualités — AviHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a class="nav-logo" href="../index.html">✈ AviHub</a>
  <ul class="nav-links">
    <li><a href="../index.html">Accueil</a></li>
    <li><a href="actualites.html" class="active">Actualités</a></li>
    <li><a href="../histoire.html">Histoire</a></li>
    <li><a href="../bia/index.html">Fiches BIA</a></li>
    <li><a href="../checklist/dr400.html">Checklist DR400</a></li>
    <li><a href="../notes/index.html">Mes notes</a></li>
  </ul>
</nav>

<div class="container">
  <div class="page-title">📰 Actualités aéronautiques</div>
  <div class="page-subtitle">Flux RSS agrégés en temps réel depuis les principales sources aviation</div>

  <!-- Filtres par source -->
  <div style="display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1.5rem;" id="filtres">
    <button class="filtre-btn active" data-source="all">Toutes</button>
    <button class="filtre-btn" data-source="aerobuzz">Aerobuzz</button>
    <button class="filtre-btn" data-source="avweb">AvWeb</button>
    <button class="filtre-btn" data-source="aerocontact">Aérocontact</button>
  </div>

  <div id="news-container" class="grid grid-2">
    <div class="loading" style="grid-column:1/-1">
      <div class="spinner"></div>Chargement des actualités…
    </div>
  </div>
</div>

<style>
.filtre-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: .35rem .85rem;
  border-radius: 999px;
  font-size: .8rem;
  cursor: pointer;
  transition: all .15s;
}
.filtre-btn:hover { border-color: var(--accent2); color: var(--text); }
.filtre-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight:600; }
</style>

<script>
const SOURCES = [
  {
    id: 'aerobuzz',
    label: 'Aerobuzz.fr',
    url: 'https://www.aerobuzz.fr/feed/',
    count: 8
  },
  {
    id: 'avweb',
    label: 'AvWeb',
    url: 'https://www.avweb.com/feed/',
    count: 6
  },
  {
    id: 'aerocontact',
    label: 'Aérocontact',
    url: 'https://www.aerocontact.com/flux-rss/actualites-aero.xml',
    count: 6
  }
];

let allArticles = [];
let activeFilter = 'all';

function renderCard(item) {
  const desc = (item.description || '').replace(/<[^>]+>/g, '').replace(/&[a-z]+;/gi,'').trim();
  const date = new Date(item.pubDate).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
  const img = item.thumbnail || item.enclosure?.link || '';
  return `
    <div class="card" data-source="${item._sourceId}">
      <a href="${item.link}" target="_blank" rel="noopener">
        ${img ? `<img src="${img}" alt="" style="width:100%;border-radius:6px;margin-bottom:.75rem;max-height:160px;object-fit:cover;">` : ''}
        <div class="card-source">${item._sourceLabel}</div>
        <div class="card-title">${item.title}</div>
        <div class="card-desc">${desc.slice(0, 200)}${desc.length > 200 ? '…' : ''}</div>
        <div class="card-date">${date}</div>
      </a>
    </div>
  `;
}

function renderArticles() {
  const container = document.getElementById('news-container');
  const filtered = activeFilter === 'all' ? allArticles : allArticles.filter(a => a._sourceId === activeFilter);
  if (filtered.length === 0) {
    container.innerHTML = `<div class="loading" style="grid-column:1/-1;color:var(--muted)">Aucun article pour cette source.</div>`;
    return;
  }
  container.innerHTML = filtered.map(renderCard).join('');
}

async function fetchSource(src) {
  const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(src.url)}&count=${src.count}`;
  const r = await fetch(apiUrl);
  const d = await r.json();
  return (d.items || []).map(item => ({
    ...item,
    _sourceId: src.id,
    _sourceLabel: src.label
  }));
}

async function loadAll() {
  const results = await Promise.allSettled(SOURCES.map(fetchSource));
  allArticles = results
    .filter(r => r.status === 'fulfilled')
    .flatMap(r => r.value)
    .sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
  renderArticles();
}

// Filtres
document.getElementById('filtres').addEventListener('click', e => {
  const btn = e.target.closest('.filtre-btn');
  if (!btn) return;
  document.querySelectorAll('.filtre-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.source;
  renderArticles();
});

loadAll();
</script>

</body>
</html>
