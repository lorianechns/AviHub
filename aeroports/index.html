<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aéroports — AviHub</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{height:100%;overflow:hidden;}
.aero-wrap{display:grid;grid-template-columns:1fr 320px;height:calc(100vh - 54px);}
#map{height:100%;z-index:1;}

/* Sidebar */
.sidebar{background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sb-top{padding:1rem;border-bottom:1px solid var(--border);flex-shrink:0;}
.sb-title{font-size:.9rem;font-weight:600;margin-bottom:.75rem;color:var(--text);}
.sb-search{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:.5rem .75rem;border-radius:7px;font-size:.82rem;outline:none;font-family:inherit;}
.sb-search:focus{border-color:rgba(59,130,246,.5);}
.sb-search::placeholder{color:var(--muted);}
.region-tabs{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.6rem;}
.rtab{background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:.25rem .6rem;border-radius:5px;font-size:.7rem;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .12s;font-family:inherit;}
.rtab:hover{color:var(--text);border-color:rgba(255,255,255,.15);}
.rtab.active{background:rgba(59,130,246,.1);border-color:#3b82f6;color:#93c5fd;}

/* Results list */
.results-list{flex:1;overflow-y:auto;padding:.5rem;}
.ac-item{padding:.55rem .7rem;border-radius:7px;cursor:pointer;transition:background .1s;border:1px solid transparent;}
.ac-item:hover{background:var(--bg3);}
.ac-item.selected{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.3);}
.ac-icao{font-family:'Courier New',monospace;font-size:.75rem;font-weight:700;color:var(--accent);}
.ac-name{font-size:.82rem;font-weight:500;color:var(--text);margin:.1rem 0;}
.ac-ville{font-size:.72rem;color:var(--muted);}
.ac-type-badge{display:inline-block;font-size:.6rem;padding:.1rem .4rem;border-radius:999px;font-weight:600;margin-left:.4rem;}
.t-large{background:rgba(59,130,246,.1);color:#60a5fa;border:1px solid rgba(59,130,246,.25);}
.t-medium{background:rgba(245,158,11,.08);color:#fbbf24;border:1px solid rgba(245,158,11,.2);}
.t-small{background:rgba(100,116,139,.1);color:#94a3b8;border:1px solid rgba(100,116,139,.25);}

/* Detail panel */
.detail-panel{padding:1rem;border-top:1px solid var(--border);flex-shrink:0;display:none;}
.detail-panel.show{display:block;}
.dp-icao{font-family:'Courier New',monospace;font-size:1.5rem;font-weight:700;color:var(--accent);letter-spacing:.05em;}
.dp-iata{font-size:.85rem;color:var(--muted);font-family:'Courier New',monospace;margin-left:.5rem;}
.dp-name{font-size:1rem;font-weight:600;color:var(--text);margin:.3rem 0 .15rem;}
.dp-ville{font-size:.82rem;color:var(--muted);margin-bottom:.75rem;}
.dp-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:.75rem;}
.dp-cell{background:var(--bg3);border-radius:6px;padding:.4rem .6rem;}
.dp-cell-lbl{font-size:.58rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.15rem;}
.dp-cell-val{font-size:.82rem;font-weight:500;color:var(--text);}
.vac-btn{display:flex;align-items:center;gap:.5rem;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--accent);padding:.5rem .85rem;border-radius:7px;text-decoration:none;font-size:.8rem;font-weight:600;transition:all .15s;width:100%;justify-content:center;margin-bottom:.4rem;}
.vac-btn:hover{background:rgba(245,158,11,.18);border-color:var(--accent);}
.sia-btn{display:flex;align-items:center;gap:.5rem;background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:.45rem .85rem;border-radius:7px;text-decoration:none;font-size:.78rem;font-weight:500;transition:all .15s;width:100%;justify-content:center;}
.sia-btn:hover{color:var(--text);border-color:rgba(255,255,255,.15);}

/* Map controls overlay */
.map-zoom-btns{position:absolute;top:68px;left:10px;z-index:1000;display:flex;flex-direction:column;gap:.3rem;}
.mz-btn{background:rgba(11,15,26,.88);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);color:var(--muted);padding:.4rem .7rem;border-radius:6px;font-size:.72rem;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .12s;font-family:inherit;text-align:left;}
.mz-btn:hover{color:var(--text);border-color:rgba(255,255,255,.2);}

/* Count badge */
.count-badge{font-size:.65rem;color:var(--muted);padding:.1rem 0;margin-top:.3rem;}

/* Leaflet popup override */
.leaflet-popup-content-wrapper{background:#111827!important;border:1px solid #1e3355!important;border-radius:8px!important;box-shadow:0 8px 24px rgba(0,0,0,.5)!important;color:#e2e8f0!important;}
.leaflet-popup-tip{background:#111827!important;}
.leaflet-popup-content{margin:.65rem .85rem!important;font-family:Inter,system-ui,sans-serif!important;font-size:.82rem!important;line-height:1.5!important;}
.pop-icao{font-family:'Courier New',monospace;font-size:.9rem;font-weight:700;color:#f59e0b;}
.pop-name{font-weight:500;margin:.2rem 0;}
.pop-type{font-size:.7rem;color:#64748b;}

@media(max-width:700px){.aero-wrap{grid-template-columns:1fr;grid-template-rows:55vh 1fr;overflow:auto;}html,body{overflow:auto;}.sidebar{border-left:none;border-top:1px solid var(--border);}.map-zoom-btns{display:none;}}
</style>

/* ══════════════════════════════════════════
   CARTE LEAFLET
══════════════════════════════════════════ */
const map = L.map('map', {zoomControl:true}).setView([46.5, 2.5], 6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap &copy; CartoDB',
  maxZoom:19
}).addTo(map);

// Custom icon
function makeIcon(type) {
  const colors = {large:'#f59e0b', medium:'#3b82f6', small:'#64748b'};
  const sizes  = {large:[18,18],   medium:[15,15],   small:[12,12]};
  const c = colors[type]||colors.small;
  const [w,h] = sizes[type]||sizes.small;
  return L.divIcon({
    html:`<div style="width:${w}px;height:${h}px;background:${c};border:2px solid rgba(255,255,255,.3);border-radius:50%;box-shadow:0 0 8px ${c}88;"></div>`,
    iconSize:[w,h], iconAnchor:[w/2,h/2], popupAnchor:[0,-(h/2+4)],
    className:'',
  });
}

const markers = {};
const layerGroups = {large:L.layerGroup(), medium:L.layerGroup(), small:L.layerGroup()};
Object.values(layerGroups).forEach(lg=>lg.addTo(map));

AIRPORTS.forEach(a=>{
  const m = L.marker([a.lat,a.lng], {icon:makeIcon(a.type)});
  m.bindPopup(`<div class="pop-icao">${a.icao}${a.iata?' / '+a.iata:''}</div><div class="pop-name">${a.name}</div><div class="pop-type">${a.ville} · ${typeLabel(a.type)} · ${a.alt}ft AMSL</div>`);
  m.on('click', ()=>showDetail(a));
  layerGroups[a.type]?.addTo(map);
  layerGroups[a.type || 'small'].addLayer(m);
  markers[a.icao] = {marker:m, data:a};
});

/* ══════════════════════════════════════════
   SIDEBAR & FILTRES
══════════════════════════════════════════ */
let currentRegion = 'all';
let currentSearch = '';
let selectedICAO  = null;

function typeLabel(t){return t==='large'?'Grande plate-forme':t==='medium'?'Aérodrome moyen':'Aérodrome local';}

function filteredAirports(){
  return AIRPORTS.filter(a=>{
    const matchRegion = currentRegion==='all'
      || (currentRegion==='FR'&&a.pays==='FR')
      || (currentRegion==='EU'&&a.region==='EU'&&a.pays!=='FR')
      || (currentRegion==='US'&&a.region==='US')
      || (currentRegion==='AS'&&a.region==='AS')
      || (currentRegion==='AF'&&a.region==='AF');
    const q = currentSearch.toLowerCase();
    const matchSearch = !q || a.icao.toLowerCase().includes(q)||a.iata.toLowerCase().includes(q)||a.name.toLowerCase().includes(q)||a.ville.toLowerCase().includes(q);
    return matchRegion && matchSearch;
  }).sort((a,b)=>{
    const order={large:0,medium:1,small:2};
    return order[a.type]-order[b.type]||a.name.localeCompare(b.name);
  });
}

function renderList(){
  const list = filteredAirports();
  document.getElementById('count-badge').textContent = `${list.length} aéroport${list.length>1?'s':''}`;
  document.getElementById('results-list').innerHTML = list.map(a=>`
    <div class="ac-item ${selectedICAO===a.icao?'selected':''}" onclick="selectAirport('${a.icao}')">
      <div style="display:flex;align-items:center;gap:.4rem;">
        <span class="ac-icao">${a.icao}</span>
        ${a.iata?`<span style="font-size:.65rem;color:var(--muted);font-family:'Courier New',monospace">${a.iata}</span>`:''}
        <span class="ac-type-badge t-${a.type}">${a.type==='large'?'Grand':a.type==='medium'?'Moyen':'Local'}</span>
      </div>
      <div class="ac-name">${a.name}</div>
      <div class="ac-ville">📍 ${a.ville} · ${a.pays} · ${a.alt} ft</div>
    </div>`).join('');
}

function filterRegion(r, btn){
  currentRegion=r;
  document.querySelectorAll('.rtab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function filterAirports(q){
  currentSearch=q;
  renderList();
}

function selectAirport(icao){
  selectedICAO=icao;
  const a=AIRPORTS.find(x=>x.icao===icao);
  if(!a)return;
  renderList();
  showDetail(a);
  map.setView([a.lat,a.lng],10,{animate:true});
  markers[icao]?.marker.openPopup();
}

function showDetail(a){
  selectedICAO=a.icao;
  document.getElementById('dp-icao').textContent=a.icao;
  document.getElementById('dp-iata').textContent=a.iata?`/ ${a.iata}`:'';
  document.getElementById('dp-name').textContent=a.name;
  document.getElementById('dp-ville').textContent=`📍 ${a.ville}`;
  document.getElementById('dp-type').textContent=typeLabel(a.type);
  document.getElementById('dp-alt').textContent=`${a.alt} ft AMSL`;
  document.getElementById('dp-coords').textContent=`${a.lat.toFixed(4)}° N\n${a.lng.toFixed(4)}° E`;
  document.getElementById('dp-pays').textContent=a.pays;
  // VAC / SIA links
  const vacBtn=document.getElementById('dp-vac');
  const siaBtn=document.getElementById('dp-sia');
  // SkyVector fonctionne pour tous les aéroports (y compris français)
  vacBtn.href=`https://skyvector.com/airport/${a.icao}`;
  vacBtn.textContent='📄 Charts — SkyVector';
  vacBtn.style.display='flex';
  if(a.pays==='FR'){
    siaBtn.href=`https://www.sia.aviation-civile.gouv.fr/aip/enligne/`;
    siaBtn.textContent='🔗 AIP France (SIA officiel)';
  } else {
    siaBtn.href=`https://ourairports.com/airports/${a.icao}/`;
    siaBtn.textContent='🔗 OurAirports.com';
  }
  document.getElementById('detail-panel').classList.add('show');
  renderList();
}
