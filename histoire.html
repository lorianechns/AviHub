<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>En ce jour — AviHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">✈ AviHub</a>
  <ul class="nav-links">
    <li><a href="index.html">Accueil</a></li>
    <li><a href="actualites.html">Actualités</a></li>
    <li><a href="histoire.html" class="active">Histoire</a></li>
    <li><a href="bia/index.html">Fiches BIA</a></li>
    <li><a href="checklist/dr400.html">Checklist DR400</a></li>
    <li><a href="notes/index.html">Mes notes</a></li>
  </ul>
</nav>

<div class="container">
  <div class="page-title">🕰️ En ce jour dans l'aviation</div>
  <div class="page-subtitle">Flashbacks historiques aéronautiques — navigue entre les dates</div>

  <!-- Sélecteur de date -->
  <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap;">
    <button id="btn-prev" style="background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:.4rem .9rem;border-radius:6px;cursor:pointer;font-size:1.1rem;">‹</button>
    <input type="date" id="date-picker" style="background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:.4rem .75rem;border-radius:6px;font-size:.9rem;cursor:pointer;">
    <button id="btn-next" style="background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:.4rem .9rem;border-radius:6px;cursor:pointer;font-size:1.1rem;">›</button>
    <button id="btn-today" style="background:var(--accent);border:none;color:#000;padding:.4rem 1rem;border-radius:6px;cursor:pointer;font-size:.85rem;font-weight:600;">Aujourd'hui</button>
  </div>

  <!-- Bannière date -->
  <div class="today-banner" id="date-banner">
    <div class="date-big" id="banner-day">—</div>
    <div>
      <div style="font-size:1rem;font-weight:600;" id="banner-month">—</div>
      <div class="date-text" id="banner-events-count">—</div>
    </div>
  </div>

  <!-- Timeline -->
  <div id="timeline-container">
    <div class="loading"><div class="spinner"></div>Chargement…</div>
  </div>

  <!-- Tous les événements -->
  <div style="margin-top:3rem;">
    <div class="page-title" style="font-size:1.1rem; margin-bottom:1rem;">📅 Tous les événements enregistrés</div>
    <div id="all-events-container" class="grid grid-2"></div>
  </div>
</div>

<script>
const MOIS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
let allData = {};
let currentDate = new Date();

function pad(n) { return String(n).padStart(2, '0'); }
function dateKey(d) { return `${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

function renderTimeline(date) {
  const key = dateKey(date);
  const events = allData[key] || [];
  const day = date.getDate();
  const month = MOIS_FR[date.getMonth()];

  document.getElementById('banner-day').textContent = day;
  document.getElementById('banner-month').textContent = month;
  document.getElementById('banner-events-count').textContent =
    events.length === 0 ? 'Aucun événement enregistré pour cette date'
    : `${events.length} événement${events.length > 1 ? 's' : ''} enregistré${events.length > 1 ? 's' : ''}`;

  const container = document.getElementById('timeline-container');
  if (events.length === 0) {
    container.innerHTML = `
      <div style="text-align:center;padding:2rem;color:var(--muted);">
        <div style="font-size:2rem;margin-bottom:.5rem">📭</div>
        Aucun événement pour le ${day} ${month}.<br>
        <span style="font-size:.8rem">Tu peux enrichir la base en éditant <code>data/histoire.json</code></span>
      </div>`;
    return;
  }

  const sorted = [...events].sort((a, b) => a.annee - b.annee);
  container.innerHTML = `<div class="timeline">${sorted.map(ev => `
    <div class="timeline-item">
      <div class="timeline-year">${ev.annee}</div>
      <div class="timeline-title">${ev.titre}</div>
      <div class="timeline-desc">${ev.description}</div>
    </div>
  `).join('')}</div>`;
}

function renderAllEvents() {
  const container = document.getElementById('all-events-container');
  const entries = Object.entries(allData).sort((a, b) => a[0].localeCompare(b[0]));
  container.innerHTML = entries.map(([key, events]) => {
    const [m, d] = key.split('-');
    const label = `${parseInt(d)} ${MOIS_FR[parseInt(m)-1]}`;
    return events.map(ev => `
      <div class="card">
        <div class="card-source">${label} ${ev.annee}</div>
        <div class="card-title">${ev.titre}</div>
        <div class="card-desc">${ev.description}</div>
      </div>
    `).join('');
  }).join('');
}

function setDate(d) {
  currentDate = d;
  document.getElementById('date-picker').value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  renderTimeline(d);
}

async function init() {
  const r = await fetch('data/histoire.json');
  allData = await r.json();
  setDate(new Date());
  renderAllEvents();
}

document.getElementById('btn-today').addEventListener('click', () => setDate(new Date()));
document.getElementById('btn-prev').addEventListener('click', () => {
  const d = new Date(currentDate); d.setDate(d.getDate() - 1); setDate(d);
});
document.getElementById('btn-next').addEventListener('click', () => {
  const d = new Date(currentDate); d.setDate(d.getDate() + 1); setDate(d);
});
document.getElementById('date-picker').addEventListener('change', e => {
  const parts = e.target.value.split('-');
  setDate(new Date(+parts[0], +parts[1]-1, +parts[2]));
});

init();
</script>

</body>
</html>
