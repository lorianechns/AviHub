function buildAccordion() {
  const container = document.getElementById('accordion-container');
  container.innerHTML = FICHES.map((f, i) => `
    <div class="accordion-item" data-index="${i}">
      <button class="accordion-header" onclick="toggleAccordion(${i})">
        <span>${f.matiere} <span class="badge ${f.badge}" style="margin-left:.5rem">${f.sous.length} thèmes</span></span>
        <span class="chevron">▼</span>
      </button>
      <div class="accordion-body" id="body-${i}">
        ${f.sous.map((s, j) => `
          <div class="fiche" id="fiche-${i}-${j}">
            <h4>${s.titre}</h4>
            <ul>${s.points.map(p => `<li>${p}</li>`).join('')}</ul>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function toggleAccordion(i) {
  const body = document.getElementById(`body-${i}`);
  const btn = body.previousElementSibling;
  body.classList.toggle('open');
  btn.classList.toggle('open');
}

// Recherche
document.getElementById('search').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  if (!q) { buildAccordion(); return; }

  const results = [];
  FICHES.forEach(f => {
    f.sous.forEach(s => {
      const matched = s.points.filter(p => p.toLowerCase().includes(q));
      if (matched.length || s.titre.toLowerCase().includes(q) || f.matiere.toLowerCase().includes(q)) {
        results.push({ matiere: f.matiere, badge: f.badge, titre: s.titre, points: matched.length ? matched : s.points });
      }
    });
  });

  const container = document.getElementById('accordion-container');
  if (results.length === 0) {
    container.innerHTML = `<div class="loading" style="color:var(--muted)">Aucun résultat pour "${this.value}"</div>`;
    return;
  }
  container.innerHTML = results.map(r => `
    <div class="accordion-item">
      <div class="accordion-header open" style="cursor:default">
        <span>${r.matiere} — <em style="font-weight:400;color:var(--muted)">${r.titre}</em></span>
      </div>
      <div class="accordion-body open">
        <div class="fiche">
          <ul>${r.points.map(p => `<li>${p.replace(new RegExp(q,'gi'), m => `<mark style="background:#78350f;color:var(--accent);border-radius:2px">${m}</mark>`)}</li>`).join('')}</ul>
        </div>
      </div>
    </div>
  `).join('');
});

buildAccordion();
