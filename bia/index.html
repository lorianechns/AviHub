<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Connaissances — AviHub</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    :root{--bg:#f8fafc;--bg2:#fff;--bg3:#f1f5f9;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;}
    body{background:#f8fafc;display:flex;flex-direction:column;min-height:100vh;}
    nav{background:#fff;border-bottom:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.06);}
    .nav-logo{color:#f59e0b !important;}
    .nav-links a{color:#64748b;}
    .nav-links a:hover,.nav-links a.active{color:#0f172a;background:#f1f5f9;}
    .card{background:#fff;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.05);}
    .card:hover{box-shadow:0 4px 16px rgba(0,0,0,.09);border-color:#cbd5e1;}

    /* Layout sidebar */
    .main-layout{display:flex;flex:1;max-width:1200px;margin:0 auto;padding:1.5rem;gap:1.5rem;width:100%;}
    .sidebar{width:200px;flex-shrink:0;}
    .sidebar-inner{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);position:sticky;top:72px;}
    .sidebar-item{display:flex;align-items:center;gap:.6rem;padding:.85rem 1rem;cursor:pointer;font-size:.88rem;font-weight:600;color:#64748b;border-bottom:1px solid #f1f5f9;transition:all .15s;}
    .sidebar-item:last-child{border-bottom:none;}
    .sidebar-item:hover{background:#f8fafc;color:#0f172a;}
    .sidebar-item.active{background:#fffbeb;color:#f59e0b;border-left:3px solid #f59e0b;}
    .content-area{flex:1;min-width:0;}

    /* Accordéon light */
    .accordion-item{background:#fff;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:.75rem;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.04);}
    .accordion-header{width:100%;background:none;border:none;color:#0f172a;padding:.9rem 1.1rem;text-align:left;font-size:.95rem;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .15s;}
    .accordion-header:hover{background:#f8fafc;}
    .accordion-header.open{background:#fffbeb;}
    .accordion-header .chevron{transition:transform .2s;color:#94a3b8;}
    .accordion-header.open .chevron{transform:rotate(180deg);}
    .accordion-body{display:none;padding:0 1.1rem 1.1rem;border-top:1px solid #f1f5f9;}
    .accordion-body.open{display:block;}
    .fiche{margin-top:.9rem;}
    .fiche h4{font-size:.8rem;color:#f59e0b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.5rem;font-weight:700;}
    .fiche ul{padding-left:1.2rem;font-size:.86rem;color:#334155;line-height:1.9;}
    .fiche ul li{margin-bottom:.15rem;}

    /* Search */
    .search-input{width:100%;background:#fff;border:1px solid #e2e8f0;color:#0f172a;padding:.65rem 1rem;border-radius:8px;font-size:.9rem;outline:none;box-shadow:0 2px 6px rgba(0,0,0,.05);margin-bottom:1.25rem;transition:border-color .15s;}
    .search-input:focus{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.12);}

    /* QCM */
    .quiz-container{max-width:680px;}
    .q-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:1.5rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,.05);}
    .q-matiere{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:#3b82f6;font-weight:700;margin-bottom:.4rem;}
    .q-text{font-size:1rem;font-weight:700;color:#0f172a;line-height:1.4;margin-bottom:1rem;}
    .q-options{display:grid;gap:.5rem;}
    .q-opt{background:#f8fafc;border:2px solid #e2e8f0;color:#334155;padding:.7rem 1rem;border-radius:8px;text-align:left;font-size:.88rem;cursor:pointer;transition:all .15s;}
    .q-opt:hover{border-color:#3b82f6;background:#eff6ff;color:#1e40af;}
    .q-opt.correct{background:#f0fdf4;border-color:#22c55e;color:#15803d;}
    .q-opt.wrong{background:#fef2f2;border-color:#ef4444;color:#991b1b;}
    .q-opt:disabled{cursor:default;}
    .q-explain{margin-top:.75rem;padding:.75rem 1rem;background:#fffbeb;border-left:3px solid #f59e0b;border-radius:0 6px 6px 0;font-size:.84rem;color:#78350f;display:none;}
    .q-explain.show{display:block;}
    .quiz-score{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:.75rem 1.25rem;display:flex;align-items:center;gap:1.5rem;margin-bottom:1.5rem;box-shadow:0 2px 8px rgba(0,0,0,.05);flex-wrap:wrap;}
    .quiz-score strong{color:#f59e0b;}
    .btn-primary{background:#f59e0b;border:none;color:#000;padding:.55rem 1.25rem;border-radius:8px;font-weight:700;cursor:pointer;font-size:.85rem;transition:background .15s;}
    .btn-primary:hover{background:#d97706;}
    .btn-secondary{background:#f1f5f9;border:1px solid #e2e8f0;color:#64748b;padding:.55rem 1.25rem;border-radius:8px;font-weight:600;cursor:pointer;font-size:.85rem;transition:all .15s;}
    .btn-secondary:hover{border-color:#94a3b8;color:#0f172a;}
    .progress-pct{height:6px;background:#f1f5f9;border-radius:3px;overflow:hidden;margin-top:.5rem;}
    .progress-pct-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#22c55e);border-radius:3px;transition:width .3s;}

    @media(max-width:680px){.main-layout{flex-direction:column;}.sidebar{width:100%;}.sidebar-inner{display:flex;} .sidebar-item{flex:1;justify-content:center;border-bottom:none;border-right:1px solid #f1f5f9;}}
  </style>

function buildAccordion(){
  const c = document.getElementById('accordion-container');
  c.innerHTML = FICHES.map((f,i)=>`
    <div class="accordion-item">
      <button class="accordion-header" onclick="toggleAcc(${i})">
        <span>${f.matiere}</span><span class="chevron">▼</span>
      </button>
      <div class="accordion-body" id="body-${i}">
        ${f.sous.map(s=>`
          <div class="fiche"><h4>${s.titre}</h4>
          <ul>${s.points.map(p=>`<li>${p}</li>`).join('')}</ul></div>`).join('')}
      </div>
    </div>`).join('');
}

function toggleAcc(i){
  const b=document.getElementById(`body-${i}`);
  const h=b.previousElementSibling;
  b.classList.toggle('open'); h.classList.toggle('open');
}

document.getElementById('search').addEventListener('input',function(){
  const q=this.value.toLowerCase();
  if(!q){ buildAccordion(); return; }
  const results=[];
  FICHES.forEach(f=>f.sous.forEach(s=>{
    const pts=s.points.filter(p=>p.toLowerCase().includes(q));
    if(pts.length||s.titre.toLowerCase().includes(q)||f.matiere.toLowerCase().includes(q))
      results.push({matiere:f.matiere,titre:s.titre,points:pts.length?pts:s.points});
  }));
  const c=document.getElementById('accordion-container');
  if(!results.length){ c.innerHTML=`<div style="color:#64748b;padding:2rem;text-align:center">Aucun résultat.</div>`; return; }
  c.innerHTML=results.map(r=>`
    <div class="accordion-item">
      <div class="accordion-header open" style="cursor:default">
        <span>${r.matiere} — <em style="font-weight:400;color:#64748b">${r.titre}</em></span>
      </div>
      <div class="accordion-body open">
        <div class="fiche"><ul>${r.points.map(p=>`<li>${p.replace(new RegExp(q,'gi'),m=>`<mark style="background:#fef9c3;border-radius:2px">${m}</mark>`)}</li>`).join('')}</ul></div>
      </div>
    </div>`).join('');
});

let shuffled=[], qIdx=0, qScore=0;

function startQuiz(){
  shuffled=[...QCM].sort(()=>Math.random()-.5);
  qIdx=0; qScore=0;
  updateScoreBar();
  showQ();
}

function updateScoreBar(){
  document.getElementById('qz-score').textContent=qScore;
  document.getElementById('qz-total').textContent=qScore;
  document.getElementById('qz-num').textContent=qIdx+1;
  document.getElementById('qz-of').textContent=shuffled.length;
  document.getElementById('qz-bar').style.width=(qIdx/shuffled.length*100)+'%';
}

  const correctText=q.opts[q.a];
  document.getElementById('qz-area').innerHTML=`
    <div class="q-card">
      <div class="q-matiere">${q.m}</div>
      <div class="q-text">${q.q}</div>
      <div class="q-options" id="q-opts">
        ${opts.map(o=>`<button class="q-opt" onclick="answerQ(this,'${escQ(o)}','${escQ(correctText)}')">${o}</button>`).join('')}
      </div>
      <div class="q-explain" id="q-explain">${q.ex}</div>
    </div>
    <div id="q-btn-row"></div>`;
  updateScoreBar();
}

function escQ(s){ return s.replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }

function answerQ(btn, chosen, correct){
  const ok = chosen===correct;
  if(ok) qScore++;
  document.querySelectorAll('.q-opt').forEach(b=>{
    b.disabled=true;
    if(b.textContent.trim()===correct) b.classList.add('correct');
    else if(b===btn && !ok) b.classList.add('wrong');
  });
  document.getElementById('q-explain').classList.add('show');
  document.getElementById('qz-score').textContent=qScore;
  document.getElementById('q-btn-row').innerHTML=`<button class="btn-primary" onclick="nextQ()" style="margin-top:.75rem">Question suivante →</button>`;
}

function nextQ(){ qIdx++; showQ(); }

function showFinal(){
  const pct=Math.round(qScore/shuffled.length*100);
  const emoji=pct>=80?'🎉':pct>=50?'👍':'📚';
  document.getElementById('qz-area').innerHTML=`
    <div class="q-card" style="text-align:center;padding:2rem">
      <div style="font-size:3rem;margin-bottom:.75rem">${emoji}</div>
      <div style="font-size:1.4rem;font-weight:800;color:#0f172a;margin-bottom:.5rem">Score final : ${qScore} / ${shuffled.length}</div>
      <div style="font-size:1rem;color:#64748b;margin-bottom:1.5rem">${pct}% de bonnes réponses</div>
      <button class="btn-primary" onclick="startQuiz()">↺ Nouveau quizz</button>
    </div>`;
  document.getElementById('qz-bar').style.width='100%';
}

function setMode(m){
  document.getElementById('mode-fiches').style.display=m==='fiches'?'block':'none';
  document.getElementById('mode-quiz').style.display  =m==='quiz'  ?'block':'none';
  document.getElementById('tab-fiches').classList.toggle('active',m==='fiches');
  document.getElementById('tab-quiz').classList.toggle('active',m==='quiz');
  if(m==='quiz'&&shuffled.length===0) startQuiz();
}

buildAccordion();
</script>
</body>
</html>
